# Published images instead of local builds (Story 6.4), the default: the
# .env that docker/init.sh writes sets
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.images.yml
#
# so plain `docker compose pull` and `docker compose up -d` use these images.
# Needs Docker Compose 2.24.4 or newer (`!reset`; docker/preflight.sh checks).
# To build from source instead, set COMPOSE_FILE=docker-compose.yml in .env
# and run `docker compose up -d --build`.
#
# IMAGE_TAG picks the release (default latest; pin X.Y.Z or X.Y in .env for
# controlled upgrades and rollbacks, without the v of the git tag: 0.3.0).
# IMAGE_REGISTRY is where the images live; change it only if the project
# moves (see docs/releasing.md).

services:
  app:
    image: ${IMAGE_REGISTRY:-ghcr.io/aldyernesto}/shotstash:${IMAGE_TAG:-latest}
    build: !reset null

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/aldyernesto}/shotstash-worker:${IMAGE_TAG:-latest}
    build: !reset null
