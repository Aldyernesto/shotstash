name: Docs

# Stories 7.1-7.4: builds the docs site (docs/, a static export) and deploys
# it to GitHub Pages. The site lives at https://<owner>.github.io/<repo>/ by
# default; set the repository variable DOCS_DOMAIN (for example
# docs.example.com) to serve it from a domain root instead (a CNAME file is
# written and no base path is used). Nothing here names the owner.
#
# When Pages is not enabled the build still runs and the deploy is skipped
# with a notice: enable it under Settings, Pages, Source "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - schema.graphql
      - openapi.json
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
      - package.json
      - public/brand/**
      - public/fonts/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
    steps:
      - uses: actions/checkout@v7

      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null); then
            echo "Pages is enabled (source: ${build_type})."
            if [ "$build_type" != "workflow" ]; then
              echo "::warning title=Docs::GitHub Pages publishes from a branch. Set Settings, Pages, Source to \"GitHub Actions\" so this workflow can deploy."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice title=Docs::GitHub Pages is not enabled for this repository, so the docs are built but not deployed. Enable it under Settings, Pages, Source \"GitHub Actions\", then run this workflow again."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      # A project site lives under /<repo>; a custom domain serves from its root.
      - name: Base path
        run: |
          if [ -n "$DOCS_DOMAIN" ]; then
            echo "DOCS_BASE_PATH=" >> "$GITHUB_ENV"
            echo "Docs domain: https://${DOCS_DOMAIN}/"
          else
            echo "DOCS_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
            echo "Docs URL: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi

      - name: Build
        run: npm run build --prefix docs

      - name: CNAME for the custom domain
        if: env.DOCS_DOMAIN != ''
        run: printf '%s\n' "$DOCS_DOMAIN" > docs/out/CNAME

      # Pages would otherwise run Jekyll on the export and drop the _next folder.
      - name: No Jekyll
        run: touch docs/out/.nojekyll

      - name: Upload the site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
