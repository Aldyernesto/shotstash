name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    name: Lint, typecheck, test, privacy scan, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholders only: prisma generate and next build need a URL, never a real database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      SESSION_SECRET: ci-placeholder-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Story 4.4/4.6: the thumbnail orientation tests need ffmpeg; the ZIP64
      # check needs unzip and zipinfo.
      - name: Install ffmpeg and unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Design tokens match DESIGN.md
        run: npm run check:tokens

      - name: Legacy allowlist only shrinks
        run: npm run check:legacy

      - name: Brand CSS is up to date
        run: npm run brand:css -- --check

      - name: Route auth matrix is up to date
        run: npm run security:matrix -- --check

      # Story 6.2: .env.example and docs/configuration.md come from src/lib/config.ts.
      - name: Env example is up to date
        run: npm run env:example:check

      # Story 6.3: settings reach the browser through GET /api/v1/config, never the build.
      - name: No build-time public variables
        run: |
          if git grep -n "NEXT_PUBLIC_" -- ':!.github/workflows/pr.yml'; then
            echo "Build-time public variables are not allowed: read the value from /api/v1/config instead."
            exit 1
          fi

      # Story 7.2: schema.graphql is generated from src/graphql/schema.ts and
      # every public member carries a description.
      - name: GraphQL SDL is described and up to date
        run: npm run sdl:check

      # Story 7.3: openapi.json is generated from the route annotations and
      # validates as OpenAPI 3.1.
      - name: OpenAPI document is up to date and valid
        run: npm run openapi:check

      # Story 6.4: no unlisted high or critical advisory in production
      # dependencies (exceptions in audit-allowlist.json, with an expiry).
      - name: Dependency audit
        run: npm run audit:check

      - name: Tests
        run: npm test

      # Story 4.6: one synthetic 4.1 GiB entry through the ZIP code, written to
      # a temporary file, must pass `unzip -t` and show its size in zipinfo.
      - name: ZIP64 archive above 4 GiB
        run: npm run zip64:check

      # Story 3.5: required for the whole src/ tree (exceptions in scripts/i18n-scope.json).
      - name: No Indonesian leftovers (whole tree)
        run: npm run i18n:check

      - name: Install gitleaks
        run: |
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Privacy scan
        run: node scripts/privacy-scan.mjs --all

      - name: Build
        run: npm run build

  # Stories 7.1-7.4: the docs site (docs/, its own package.json) installs,
  # builds as a static export under a project base path, passes its tests and
  # an offline link check, and its production dependencies pass the audit.
  docs:
    name: Docs site build and link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Docs tests
        run: npm test --prefix docs

      - name: Docs dependency audit
        run: npm run audit:check --prefix docs

      # The project site path (https://<owner>.github.io/<repo>/), as docs.yml builds it.
      - name: Build the docs with a project base path
        run: DOCS_BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build --prefix docs

      - name: Lay out the export under its base path
        run: |
          mkdir -p /tmp/site
          cp -r docs/out "/tmp/site/${GITHUB_REPOSITORY#*/}"

      # Offline: every internal link and image must resolve inside the export.
      - name: Internal links resolve
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir /tmp/site
            --index-files index.html
            '/tmp/site/**/*.html'
          fail: true
          jobSummary: true

  # Story 6.4: both release images build natively for amd64 and arm64 on
  # every PR, without pushing anywhere (the release workflow publishes).
  images:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [app, worker]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: app
            dockerfile: docker/Dockerfile
          - image: worker
            dockerfile: docker/worker.Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  # Stories 6.1-6.3: the image builds, the compose quick start boots on a
  # fresh machine, migrations run, the app runs as non-root and survives a
  # restart, and first-run setup works against the container. Story 5.3:
  # the reference worker image builds, runs in compose and makes a proxy. CI generates
  # its own throwaway secrets; nothing here is a real secret.
  docker:
    name: Docker image and compose quick start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ci-${{ github.sha }}
      BASE: http://localhost:3005
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Write .env from .env.example with generated secrets
        run: |
          cp .env.example .env
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 32)/" .env
          sed -i "s/^SETUP_TOKEN=.*/SETUP_TOKEN=$(openssl rand -hex 32)/" .env
          sed -i "s/^WORKER_BOOTSTRAP_TOKEN=.*/WORKER_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)/" .env

      - name: Preflight
        run: sh docker/preflight.sh

      - name: Build the app and worker images
        run: docker compose build --build-arg VERSION="$VERSION" app worker

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Fresh boot answers health, setup redirect and runtime config
        run: |
          curl -fsS "$BASE/api/health" | tee /tmp/health.json; echo
          jq -e --arg v "$VERSION" '.ok == true and .setupRequired == true and .version == $v' /tmp/health.json
          headers=$(curl -s -o /dev/null -D - "$BASE/" | tr -d '\r')
          echo "$headers" | head -n 1 | grep -q ' 302'
          echo "$headers" | grep -qi '^location: /setup$'
          curl -fsS -D /tmp/config.headers "$BASE/api/v1/config" | tee /tmp/config.json; echo
          grep -qi '^content-type: application/json' /tmp/config.headers
          jq -e --arg v "$VERSION" '.version == $v and .features.signup == true and .googleClientId == null and (.appUrl | type == "string")' /tmp/config.json

      - name: Every migration is applied
        run: |
          expected=$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          applied=$(docker compose exec -T db psql -U shotstash -d shotstash -tAc "select count(*) from _prisma_migrations where finished_at is not null")
          echo "applied=$applied expected=$expected"
          test "$applied" -eq "$expected"

      - name: The app process is not root
        run: |
          # PID 1 is the init process (compose init: true); check the node server itself.
          uid=$(docker compose exec -T app sh -c 'for d in /proc/[0-9]*; do if [ "$(tr "\0" " " < "$d/cmdline" 2>/dev/null)" = "node dist/server.js " ]; then stat -c %u "$d"; fi; done')
          echo "node server uid: $uid"
          test -n "$uid" && test "$uid" != "0"

      - name: Restart keeps working (migrations are a no-op)
        run: |
          docker compose restart app
          for i in $(seq 1 60); do
            if curl -fsS "$BASE/api/health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "$BASE/api/health" | jq -e '.ok == true'
          docker compose logs app | grep -q "No pending migrations"

      - name: A bad configuration refuses to start and names the variable
        run: |
          set +e
          out=$(docker compose run --rm -e SHOTSTASH_TRASH_RETENTION_DAYS=abc app 2>&1)
          status=$?
          set -e
          echo "$out" | tail -n 20
          test "$status" -ne 0
          echo "$out" | grep -q "config: SHOTSTASH_TRASH_RETENTION_DAYS"

      - name: Install dependencies for the e2e script
        run: npm ci

      # Runs in the app container's network namespace so health reports its
      # detailed body (loopback client). DATABASE_URL only satisfies the
      # script's localhost guard; e2e:setup never connects to it.
      - name: e2e:setup against the container
        run: |
          docker run --rm --network "container:$(docker compose ps -q app)" \
            -v "$PWD:/w" -w /w \
            -e E2E_BASE_URL=http://127.0.0.1:3005 \
            -e E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)" \
            -e DATABASE_URL=postgresql://guard@127.0.0.1:5432/none \
            node:24-bookworm-slim node scripts/e2e-setup.mjs

      # Story 4.3: a 1 GiB upload through a proxy that cuts the connection
      # twice resumes and arrives with the right MD5 (the owner from e2e:setup).
      - name: Interrupted upload resumes (1 GiB)
        run: |
          docker run --rm --network "container:$(docker compose ps -q app)" \
            -v "$PWD:/w" -w /w \
            -e E2E_BASE_URL=http://127.0.0.1:3005 \
            -e E2E_EMAIL=owner@example.com,other@example.com \
            -e E2E_PASSWORD=owner-password-1 \
            -e E2E_UPLOAD_MB=1024 \
            node:24-bookworm-slim node scripts/e2e-upload-resume.mjs

      # Story 5.3: the reference worker (compose service) turns a generated
      # 10 s 1080p sample into a 720p H.264 proxy through the contract.
      - name: Reference worker makes a proxy
        run: |
          docker compose exec -T cache redis-cli FLUSHALL
          mkdir -p ci-out && chmod 777 ci-out
          docker run --rm -v "$PWD/ci-out:/out" shotstash-worker:local \
            ffmpeg -v error -y -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440 \
            -t 10 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest /out/sample.mp4
          docker run --rm --network "container:$(docker compose ps -q app)" \
            -v "$PWD:/w" -w /w \
            -e E2E_BASE_URL=http://127.0.0.1:3005 \
            -e E2E_EMAIL=owner@example.com,other@example.com \
            -e E2E_PASSWORD=owner-password-1 \
            -e E2E_SAMPLE=ci-out/sample.mp4 \
            -e E2E_OUT=ci-out/proxy.mp4 \
            -e E2E_TIMEOUT_SECONDS=300 \
            node:24-bookworm-slim node scripts/e2e-worker.mjs
          probe=$(docker run --rm -v "$PWD/ci-out:/out" shotstash-worker:local \
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,height -of json /out/proxy.mp4)
          echo "$probe"
          echo "$probe" | jq -e '.streams[0].codec_name == "h264" and .streams[0].height <= 720'

      - name: The worker survives an app restart (heartbeat resumes)
        run: |
          before=$(date -u +%s)
          docker compose restart app
          for i in $(seq 1 60); do
            if curl -fsS "$BASE/api/health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          last=0
          for i in $(seq 1 60); do
            last=$(docker compose exec -T db psql -U shotstash -d shotstash -tAc \
              "select coalesce(max(extract(epoch from last_seen)), 0)::bigint from pipeline_workers where revoked_at is null")
            if [ "$last" -gt "$before" ]; then break; fi
            sleep 3
          done
          echo "restart=$before last_seen=$last"
          test "$last" -gt "$before"
          test "$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q worker)")" = "0"
          docker compose logs worker | tail -n 20

      # Story 7.4: the backup and restore procedure of the docs
      # (docs/content/docs/backup.mdx), end to end: data is created, dumped and
      # copied, the stack is wiped with down -v, restored, and the restored
      # instance signs in and serves the same file bytes.
      - name: Backup and restore rehearsal
        run: |
          e2e_backup() {
            docker run --rm --network "container:$(docker compose ps -q app)"               -v "$PWD:/w" -w /w               -e E2E_BASE_URL=http://127.0.0.1:3005               -e E2E_EMAIL=owner@example.com,other@example.com               -e E2E_PASSWORD=owner-password-1               node:24-bookworm-slim node scripts/e2e-backup.mjs "$@"
          }
          media_sums() { (cd data/media && sudo find . -type f -print0 | sort -z | sudo xargs -0 -r sha256sum); }
          docker compose exec -T cache redis-cli FLUSHALL
          e2e_backup snapshot ci-out/backup-state.json

          echo "--- back up"
          docker compose stop app worker
          docker compose exec -T db pg_dump -U shotstash shotstash > ci-out/shotstash.sql
          sudo cp -a data/media ci-out/media-backup
          media_sums > ci-out/media-before.txt
          test -s ci-out/shotstash.sql

          echo "--- lose everything"
          docker compose down -v
          sudo rm -rf data/media

          echo "--- restore"
          sudo cp -a ci-out/media-backup data/media
          docker compose up -d db
          docker compose exec -T db sh -c 'until pg_isready -h 127.0.0.1 -U shotstash -d shotstash; do sleep 1; done'
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -q -U shotstash shotstash < ci-out/shotstash.sql
          docker compose up -d --wait --wait-timeout 300

          media_sums > ci-out/media-after.txt
          diff ci-out/media-before.txt ci-out/media-after.txt
          docker compose logs app | grep -q "No pending migrations"
          e2e_backup verify ci-out/backup-state.json

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Story 4.2: the storage contract on a real S3-compatible server (RustFS;
  # the upstream MinIO images can no longer be pulled), plus a Range and ZIP
  # smoke through the media module. The test creates its bucket.
  s3:
    name: S3 backend contract (RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: shotstash
          RUSTFS_SECRET_KEY: shotstash-secret
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY_ID: shotstash
      S3_TEST_SECRET_ACCESS_KEY: shotstash-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Wait for RustFS
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/health

      - name: Storage contract, Range and ZIP on S3
        run: npm run test:s3 -- --test-timeout=60000

  # Stories 4.1-4.3: uploads end to end on both backends. The built app runs
  # against PostgreSQL, Dragonfly and (s3 leg) RustFS service containers;
  # e2e:security covers part ownership, every part error code, dedup
  # (initiate refusal, upload anyway, race), cancel, checksum mismatch and
  # sweeper expiry, and the harness resumes a 256 MiB upload through a
  # proxy that cuts the connection twice. Throwaway credentials only.
  e2e:
    name: E2E uploads (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [local, s3]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      cache:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
        ports:
          - 6379:6379
        options: --ulimit memlock=-1
      # Story 4.5: the local leg searches through Elasticsearch, the s3 leg
      # without it; both run the search parity check.
      elasticsearch:
        image: ${{ matrix.backend == 'local' && 'elasticsearch:9.5.3' || '' }}
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
      rustfs:
        # An empty image skips the service on the local leg.
        image: ${{ matrix.backend == 's3' && 'rustfs/rustfs:1.0.0' || '' }}
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: shotstash
          RUSTFS_SECRET_KEY: shotstash-secret
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DRAGONFLY_HOST: 127.0.0.1
      EMAIL_TRANSPORT: log
      NEXT_TELEMETRY_DISABLED: "1"
      STORAGE_BACKEND: ${{ matrix.backend }}
      ELASTICSEARCH_NODE_URL: ${{ matrix.backend == 'local' && 'http://127.0.0.1:9200' || '' }}
      STORAGE_LOCAL_ROOT: ./data/media
      S3_ENDPOINT: ${{ matrix.backend == 's3' && 'http://127.0.0.1:9000' || '' }}
      S3_BUCKET: ${{ matrix.backend == 's3' && 'shotstash-e2e' || '' }}
      S3_ACCESS_KEY_ID: ${{ matrix.backend == 's3' && 'shotstash' || '' }}
      S3_SECRET_ACCESS_KEY: ${{ matrix.backend == 's3' && 'shotstash-secret' || '' }}
      S3_FORCE_PATH_STYLE: "true"
      # Story 5.1: the shortest sweep allowed in production, so e2e:pipeline
      # sees expired claims requeued within seconds.
      SHOTSTASH_PIPELINE_SWEEP_SECONDS: "5"
      # A 1 MiB output limit lets e2e:pipeline prove 413 OUTPUT_TOO_LARGE cheaply.
      SHOTSTASH_PIPELINE_MAX_OUTPUT_MB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # ffmpeg for video thumbnails; heif-enc (libheif-examples plus the x265 encoder plugin) makes the
      # synthetic HEIC of the e2e HEIC row at test time.
      - name: Install ffmpeg and heif-enc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libheif-examples libheif-plugin-x265

      - name: Install dependencies
        run: npm ci

      - name: Session secret and worker bootstrap token
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "WORKER_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create the bucket (s3 leg)
        if: matrix.backend == 's3'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          node -e "
            const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
            const c = new S3Client({ endpoint: process.env.S3_ENDPOINT, region: 'us-east-1', forcePathStyle: true,
              credentials: { accessKeyId: process.env.S3_ACCESS_KEY_ID, secretAccessKey: process.env.S3_SECRET_ACCESS_KEY } });
            c.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET })).then(() => console.log('bucket created'));
          "

      - name: Migrate and seed
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Wait for Elasticsearch (local leg)
        if: matrix.backend == 'local'
        run: |
          for i in $(seq 1 90); do
            if curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:9200/_cluster/health; echo
              exit 0
            fi
            sleep 2
          done
          echo "Elasticsearch did not reach yellow in time"
          exit 1

      - name: Search parity (with Elasticsearch on the local leg, database only on s3)
        run: npm run e2e:search

      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          NODE_ENV=production nohup node dist/server.js > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3005/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3005/api/health

      # Story 5.5: a second app process on the same database and Dragonfly;
      # e2e:realtime proves an event published by one process reaches the
      # subscribers of the other.
      - name: Start a second app process
        run: |
          PORT=3006 NODE_ENV=production nohup node dist/server.js > /tmp/app2.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3006/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3006/api/health

      # The harness runs first; the rate limit counters are reset before
      # e2e:security (login limit 10 per 15 minutes per IP).
      - name: Interrupted upload resumes (256 MiB)
        env:
          E2E_BASE_URL: http://127.0.0.1:3005
          E2E_UPLOAD_MB: "256"
        run: npm run e2e:upload

      # Both steps log in from the same IP; delete the rate limit counters so
      # e2e:security starts with a fresh budget.
      - name: Reset rate limit counters
        # Only the limiter's keys (rl:*); the cache container is the one publishing 6379.
        run: |
          c="$(docker ps -q --filter publish=6379 | head -n 1)"
          test -n "$c"
          docker exec "$c" redis-cli --scan --pattern 'rl:*' | xargs -r -n 100 docker exec "$c" redis-cli DEL

      - name: e2e:security (uploads, dedup, cancel, expiry, shares, trash)
        env:
          E2E_BASE_URL: http://127.0.0.1:3005
        run: npm run e2e:security

      # Stories 5.1-5.2: queue and worker contract (claims, kind filter,
      # requeue, late completion, cancel race, Range input, output, fail).
      - name: Reset rate limit counters (pipeline)
        # Only the limiter's keys (rl:*); the cache container is the one publishing 6379.
        run: |
          c="$(docker ps -q --filter publish=6379 | head -n 1)"
          test -n "$c"
          docker exec "$c" redis-cli --scan --pattern 'rl:*' | xargs -r -n 100 docker exec "$c" redis-cli DEL

      - name: e2e:pipeline (job queue and worker contract)
        env:
          E2E_BASE_URL: http://127.0.0.1:3005
          E2E_SWEEP_WAIT_SECONDS: "45"
        run: npm run e2e:pipeline

      # Story 5.5: realtime over graphql-ws (mention within 2 s, ordered job
      # events, nothing published for a rolled-back write, per-event auth
      # ends a stream, delivery across the two app processes).
      - name: Reset rate limit counters (realtime)
        # Only the limiter's keys (rl:*); the cache container is the one publishing 6379.
        run: |
          c="$(docker ps -q --filter publish=6379 | head -n 1)"
          test -n "$c"
          docker exec "$c" redis-cli --scan --pattern 'rl:*' | xargs -r -n 100 docker exec "$c" redis-cli DEL

      - name: e2e:realtime (ordered events through Dragonfly, two app processes)
        env:
          E2E_BASE_URL: http://127.0.0.1:3005
          E2E_BASE_URL_2: http://127.0.0.1:3006
        run: npm run e2e:realtime

      - name: Reset rate limit counters (discussion off)
        run: |
          c="$(docker ps -q --filter publish=6379 | head -n 1)"
          test -n "$c"
          docker exec "$c" redis-cli --scan --pattern 'rl:*' | xargs -r -n 100 docker exec "$c" redis-cli DEL

      # Story 5.5: the discussion toggle, on a short-lived third process.
      - name: e2e:discussion-off (SHOTSTASH_FEATURE_DISCUSSION=false)
        env:
          E2E_BASE_URL: http://127.0.0.1:3007
          E2E_OTHER_BASE_URL: http://127.0.0.1:3005
        run: |
          SHOTSTASH_FEATURE_DISCUSSION=false PORT=3007 NODE_ENV=production nohup node dist/server.js > /tmp/app3.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3007/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          status=0
          npm run e2e:discussion-off || status=$?
          kill "$pid" || true
          exit "$status"

      - name: App log on failure
        if: failure()
        run: |
          tail -n 300 /tmp/app.log
          echo "---- second app process ----"
          tail -n 100 /tmp/app2.log || true
          echo "---- third app process (discussion off) ----"
          tail -n 100 /tmp/app3.log || true
