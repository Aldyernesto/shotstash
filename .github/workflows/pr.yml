name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    name: Lint, typecheck, test, privacy scan, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholders only: prisma generate and next build need a URL, never a real database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      SESSION_SECRET: ci-placeholder-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Design tokens match DESIGN.md
        run: npm run check:tokens

      - name: Legacy allowlist only shrinks
        run: npm run check:legacy

      - name: Brand CSS is up to date
        run: npm run brand:css -- --check

      - name: Route auth matrix is up to date
        run: npm run security:matrix -- --check

      # Story 6.2: .env.example and docs/configuration.md come from src/lib/config.ts.
      - name: Env example is up to date
        run: npm run env:example:check

      # Story 6.3: settings reach the browser through GET /api/v1/config, never the build.
      - name: No build-time public variables
        run: |
          if git grep -n "NEXT_PUBLIC_" -- ':!.github/workflows/pr.yml'; then
            echo "Build-time public variables are not allowed: read the value from /api/v1/config instead."
            exit 1
          fi

      - name: Tests
        run: npm test

      # Story 3.5: required for the whole src/ tree (exceptions in scripts/i18n-scope.json).
      - name: No Indonesian leftovers (whole tree)
        run: npm run i18n:check

      - name: Install gitleaks
        run: |
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Privacy scan
        run: node scripts/privacy-scan.mjs --all

      - name: Build
        run: npm run build

  # Stories 6.1-6.3: the image builds, the compose quick start boots on a
  # fresh machine, migrations run, the app runs as non-root and survives a
  # restart, and first-run setup works against the container. CI generates
  # its own throwaway secrets; nothing here is a real secret.
  docker:
    name: Docker image and compose quick start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ci-${{ github.sha }}
      BASE: http://localhost:3005
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Write .env from .env.example with generated secrets
        run: |
          cp .env.example .env
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 32)/" .env
          sed -i "s/^SETUP_TOKEN=.*/SETUP_TOKEN=$(openssl rand -hex 32)/" .env

      - name: Preflight
        run: sh docker/preflight.sh

      - name: Build the app image
        run: docker compose build --build-arg VERSION="$VERSION" app

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Fresh boot answers health, setup redirect and runtime config
        run: |
          curl -fsS "$BASE/api/health" | tee /tmp/health.json; echo
          jq -e --arg v "$VERSION" '.ok == true and .setupRequired == true and .version == $v' /tmp/health.json
          headers=$(curl -s -o /dev/null -D - "$BASE/" | tr -d '\r')
          echo "$headers" | head -n 1 | grep -q ' 302'
          echo "$headers" | grep -qi '^location: /setup$'
          curl -fsS -D /tmp/config.headers "$BASE/api/v1/config" | tee /tmp/config.json; echo
          grep -qi '^content-type: application/json' /tmp/config.headers
          jq -e --arg v "$VERSION" '.version == $v and .features.signup == true and .googleClientId == null and (.appUrl | type == "string")' /tmp/config.json

      - name: Every migration is applied
        run: |
          expected=$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          applied=$(docker compose exec -T db psql -U shotstash -d shotstash -tAc "select count(*) from _prisma_migrations where finished_at is not null")
          echo "applied=$applied expected=$expected"
          test "$applied" -eq "$expected"

      - name: The app process is not root
        run: |
          # PID 1 is the init process (compose init: true); check the node server itself.
          uid=$(docker compose exec -T app sh -c 'for d in /proc/[0-9]*; do if [ "$(tr "\0" " " < "$d/cmdline" 2>/dev/null)" = "node dist/server.js " ]; then stat -c %u "$d"; fi; done')
          echo "node server uid: $uid"
          test -n "$uid" && test "$uid" != "0"

      - name: Restart keeps working (migrations are a no-op)
        run: |
          docker compose restart app
          for i in $(seq 1 60); do
            if curl -fsS "$BASE/api/health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "$BASE/api/health" | jq -e '.ok == true'
          docker compose logs app | grep -q "No pending migrations"

      - name: A bad configuration refuses to start and names the variable
        run: |
          set +e
          out=$(docker compose run --rm -e SHOTSTASH_TRASH_RETENTION_DAYS=abc app 2>&1)
          status=$?
          set -e
          echo "$out" | tail -n 20
          test "$status" -ne 0
          echo "$out" | grep -q "config: SHOTSTASH_TRASH_RETENTION_DAYS"

      - name: Install dependencies for the e2e script
        run: npm ci

      # Runs in the app container's network namespace so health reports its
      # detailed body (loopback client). DATABASE_URL only satisfies the
      # script's localhost guard; e2e:setup never connects to it.
      - name: e2e:setup against the container
        run: |
          docker run --rm --network "container:$(docker compose ps -q app)" \
            -v "$PWD:/w" -w /w \
            -e E2E_BASE_URL=http://127.0.0.1:3005 \
            -e E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)" \
            -e DATABASE_URL=postgresql://guard@127.0.0.1:5432/none \
            node:24-bookworm-slim node scripts/e2e-setup.mjs

      # Story 4.3: a 1 GiB upload through a proxy that cuts the connection
      # twice resumes and arrives with the right MD5 (the owner from e2e:setup).
      - name: Interrupted upload resumes (1 GiB)
        run: |
          docker run --rm --network "container:$(docker compose ps -q app)" \
            -v "$PWD:/w" -w /w \
            -e E2E_BASE_URL=http://127.0.0.1:3005 \
            -e E2E_EMAIL=owner@example.com,other@example.com \
            -e E2E_PASSWORD=owner-password-1 \
            -e E2E_UPLOAD_MB=1024 \
            node:24-bookworm-slim node scripts/e2e-upload-resume.mjs

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Story 4.2: the storage contract on a real S3-compatible server (RustFS;
  # the upstream MinIO images can no longer be pulled), plus a Range and ZIP
  # smoke through the media module. The test creates its bucket.
  s3:
    name: S3 backend contract (RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: shotstash
          RUSTFS_SECRET_KEY: shotstash-secret
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY_ID: shotstash
      S3_TEST_SECRET_ACCESS_KEY: shotstash-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Wait for RustFS
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/health

      - name: Storage contract, Range and ZIP on S3
        run: npm run test:s3 -- --test-timeout=60000

  # Stories 4.1-4.3: uploads end to end on both backends. The built app runs
  # against PostgreSQL, Dragonfly and (s3 leg) RustFS service containers;
  # e2e:security covers part ownership, every part error code, dedup
  # (initiate refusal, upload anyway, race), cancel, checksum mismatch and
  # sweeper expiry, and the harness resumes a 256 MiB upload through a
  # proxy that cuts the connection twice. Throwaway credentials only.
  e2e:
    name: E2E uploads (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [local, s3]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      cache:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
        ports:
          - 6379:6379
        options: --ulimit memlock=-1
      rustfs:
        # An empty image skips the service on the local leg.
        image: ${{ matrix.backend == 's3' && 'rustfs/rustfs:1.0.0' || '' }}
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: shotstash
          RUSTFS_SECRET_KEY: shotstash-secret
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DRAGONFLY_HOST: 127.0.0.1
      EMAIL_TRANSPORT: log
      NEXT_TELEMETRY_DISABLED: "1"
      STORAGE_BACKEND: ${{ matrix.backend }}
      STORAGE_LOCAL_ROOT: ./data/media
      S3_ENDPOINT: ${{ matrix.backend == 's3' && 'http://127.0.0.1:9000' || '' }}
      S3_BUCKET: ${{ matrix.backend == 's3' && 'shotstash-e2e' || '' }}
      S3_ACCESS_KEY_ID: ${{ matrix.backend == 's3' && 'shotstash' || '' }}
      S3_SECRET_ACCESS_KEY: ${{ matrix.backend == 's3' && 'shotstash-secret' || '' }}
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg (video thumbnails)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Session secret
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create the bucket (s3 leg)
        if: matrix.backend == 's3'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          node -e "
            const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
            const c = new S3Client({ endpoint: process.env.S3_ENDPOINT, region: 'us-east-1', forcePathStyle: true,
              credentials: { accessKeyId: process.env.S3_ACCESS_KEY_ID, secretAccessKey: process.env.S3_SECRET_ACCESS_KEY } });
            c.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET })).then(() => console.log('bucket created'));
          "

      - name: Migrate and seed
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          NODE_ENV=production nohup node dist/server.js > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3005/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3005/api/health

      - name: e2e:security (uploads, dedup, cancel, expiry, shares, trash)
        env:
          E2E_BASE_URL: http://127.0.0.1:3005
        run: npm run e2e:security

      - name: Interrupted upload resumes (256 MiB)
        env:
          E2E_BASE_URL: http://127.0.0.1:3005
          E2E_UPLOAD_MB: "256"
        run: npm run e2e:upload

      - name: App log on failure
        if: failure()
        run: tail -n 300 /tmp/app.log
